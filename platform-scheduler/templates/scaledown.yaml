{{- $global := .Values.scheduler }}
{{- $schedule := .Values.platformSchedule }}
{{- $depSchedule := .Values.platformSchedule.dependencies | default dict }}
{{- $appSchedule := .Values.platformSchedule.applications | default dict }}
{{- $depEnabled := $depSchedule.enabled | default false }}
{{- $appEnabled := $appSchedule.enabled | default false }}
{{- $appNamespaces := $appSchedule.namespaces | default list }}
{{- $ns := .Release.Namespace }}
{{- $timezone := $schedule.timezone | default "UTC" }}
{{- $end := $schedule.end }}
{{- $saName := $global.serviceAccountName }}
{{- $apps := $depSchedule.apps | default list }}
{{- $stateCmName := printf "%s-state" .Release.Name }}
{{- $sweep := .Values.platformSchedule.karpenterSweep | default dict }}
{{- $sweepEnabled := $sweep.enabled | default false }}
{{- $sweepNamespaces := $sweep.addonNamespaces | default (list "kube-system" "gatekeeper-system") }}
{{- $sweepTimeout := $sweep.timeoutSeconds | default 900 | int }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-scaledown
  namespace: {{ $ns }}
spec:
  schedule: {{ $end | default "0 0 31 2 *" | quote }}
  timeZone: {{ $timezone | quote }}
  startingDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 60
      template:
        spec:
          serviceAccountName: {{ $saName }}
          {{- with $global.nodeSelector }}
          nodeSelector:
          {{ toYaml . | indent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: shutdown
              image: {{ printf "%s:%s" $global.image.repository ($global.image.tag | toString) | quote }}
              imagePullPolicy: {{ $global.image.pullPolicy | default "IfNotPresent" }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  log() {
                    local level="$1"
                    shift
                    local timestamp
                    timestamp="$(date '+%Y-%m-%d %H:%M:%S UTC')"
                    echo "$timestamp $level: $*"
                  }

                  log "INFO" "Starting platform scaledown"

                  PATCH_DATA=""
                  keep_state() {
                    local saved
                    saved=$(kubectl -n {{ $ns }} get configmap {{ $stateCmName }} -o jsonpath="{.data['$1']}" 2>/dev/null || true)
                    if [ -n "$saved" ]; then
                      PATCH_DATA="${PATCH_DATA}\"$1\":\"${saved}\","
                    fi
                  }
                  {{- if $appEnabled }}
                  {{- range $appNamespaces }}
                  # === Applications first: save replicas, then suspend CJ/SJ ===
                  log "INFO" "Scaling application deployments in {{ . }} to zero"
                  for DEPLOY in $(kubectl -n {{ . }} get deploy -o name 2>/dev/null); do
                    NAME=$(echo "$DEPLOY" | cut -d/ -f2)
                    REPLICAS=$(kubectl -n {{ . }} get "$DEPLOY" -o jsonpath='{.spec.replicas}')
                    if [ "$REPLICAS" != "0" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_${NAME}\":\"${REPLICAS}\","
                      kubectl -n {{ . }} scale "$DEPLOY" --replicas=0
                      log "INFO" "Scaled $DEPLOY in {{ . }} from $REPLICAS to 0"
                    else
                      keep_state "{{ . }}_${NAME}"
                      log "INFO" "Skipping $DEPLOY in {{ . }} (replicas already 0)"
                    fi
                  done
                  for STS in $(kubectl -n {{ . }} get statefulset -o name 2>/dev/null); do
                    NAME=$(echo "$STS" | cut -d/ -f2)
                    REPLICAS=$(kubectl -n {{ . }} get "$STS" -o jsonpath='{.spec.replicas}')
                    if [ "$REPLICAS" != "0" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_${NAME}\":\"${REPLICAS}\","
                      kubectl -n {{ . }} scale "$STS" --replicas=0
                      log "INFO" "Scaled $STS in {{ . }} from $REPLICAS to 0"
                    else
                      keep_state "{{ . }}_${NAME}"
                      log "INFO" "Skipping $STS in {{ . }} (replicas already 0)"
                    fi
                  done

                  # === Applications: suspend CronJobs (save current state first) ===
                  log "INFO" "Suspending CronJobs in {{ . }}"
                  for CJ in $(kubectl -n {{ . }} get cronjob -o name 2>/dev/null); do
                    NAME=$(echo "$CJ" | cut -d/ -f2)
                    SUSPENDED=$(kubectl -n {{ . }} get "$CJ" -o jsonpath='{.spec.suspend}')
                    if [ "$SUSPENDED" != "true" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_cj_${NAME}\":\"false\","
                      kubectl -n {{ . }} patch "$CJ" -p '{"spec":{"suspend":true}}'
                      log "INFO" "Suspended $CJ in {{ . }}"
                    else
                      keep_state "{{ . }}_cj_${NAME}"
                      log "INFO" "Skipping $CJ in {{ . }} (already suspended)"
                    fi
                  done

                  # === Applications: patch ScaledJobs minReplicaCount, then pause ===
                  log "INFO" "Patching minReplicaCount=0 and pausing ScaledJobs in {{ . }}"
                  for SJ in $(kubectl -n {{ . }} get scaledjob -o name 2>/dev/null); do
                    NAME=$(echo "$SJ" | cut -d/ -f2)
                    MIN_REPLICAS=$(kubectl -n {{ . }} get "$SJ" -o jsonpath='{.spec.minReplicaCount}' 2>/dev/null | tr -d '\r[:space:]')
                    WAS_PAUSED=$(kubectl -n {{ . }} get "$SJ" -o jsonpath='{.metadata.annotations["autoscaling.keda.sh/paused"]}' 2>/dev/null | tr '[:upper:]' '[:lower:]' | tr -d '\r[:space:]')
                    if [ -n "$MIN_REPLICAS" ] && [ "$MIN_REPLICAS" != "0" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_sjmr_${NAME}\":\"${MIN_REPLICAS}\","
                      kubectl -n {{ . }} patch "$SJ" --type=merge -p '{"spec":{"minReplicaCount":0}}'
                      log "INFO" "Patched $SJ in {{ . }} minReplicaCount from $MIN_REPLICAS to 0"
                    elif [ "$WAS_PAUSED" = "true" ]; then
                      keep_state "{{ . }}_sjmr_${NAME}"
                      log "INFO" "Skipping $SJ in {{ . }} (minReplicaCount already 0 and paused; keeping saved state)"
                    elif [ -z "$MIN_REPLICAS" ]; then
                      log "INFO" "Skipping $SJ in {{ . }} (minReplicaCount is unset; KEDA default is 0)"
                    else
                      log "INFO" "Skipping $SJ in {{ . }} (minReplicaCount already 0; nothing to restore)"
                    fi
                    if [ "$WAS_PAUSED" = "true" ]; then
                      keep_state "{{ . }}_sjp_${NAME}"
                      log "INFO" "Skipping pause for $SJ in {{ . }} (already paused)"
                    else
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_sjp_${NAME}\":\"false\","
                      kubectl -n {{ . }} annotate "$SJ" autoscaling.keda.sh/paused="true" --overwrite
                      log "INFO" "Paused $SJ in {{ . }}"
                    fi
                  done

                  # === Applications: pause ScaledObjects at 0 replicas while KEDA still runs ===
                  log "INFO" "Pausing ScaledObjects in {{ . }} at 0 replicas"
                  PAUSED_SO=""
                  for SO in $(kubectl -n {{ . }} get scaledobject -o name 2>/dev/null); do
                    NAME=$(echo "$SO" | cut -d/ -f2)
                    PAUSED_REPLICAS=$(kubectl -n {{ . }} get "$SO" -o jsonpath='{.metadata.annotations["autoscaling.keda.sh/paused-replicas"]}' 2>/dev/null | tr -d '\r[:space:]')
                    WAS_PAUSED=$(kubectl -n {{ . }} get "$SO" -o jsonpath='{.metadata.annotations["autoscaling.keda.sh/paused"]}' 2>/dev/null | tr '[:upper:]' '[:lower:]' | tr -d '\r[:space:]')
                    if [ -n "$PAUSED_REPLICAS" ] || [ "$WAS_PAUSED" = "true" ]; then
                      keep_state "{{ . }}_sop_${NAME}"
                      log "INFO" "Skipping $SO in {{ . }} (already paused)"
                    else
                      PATCH_DATA="${PATCH_DATA}\"{{ . }}_sop_${NAME}\":\"true\","
                      kubectl -n {{ . }} annotate "$SO" autoscaling.keda.sh/paused-replicas="0" --overwrite
                      PAUSED_SO="$PAUSED_SO $NAME"
                      log "INFO" "Paused $SO in {{ . }} at 0 replicas"
                    fi
                  done
                  for NAME in $PAUSED_SO; do
                    WAITED=0
                    until [ "$(kubectl -n {{ . }} get scaledobject "$NAME" -o jsonpath='{.status.conditions[?(@.type=="Paused")].status}' 2>/dev/null)" = "True" ]; do
                      if [ "$WAITED" -ge 60 ]; then
                        log "WARNING" "scaledobject/$NAME in {{ . }} not reported Paused by KEDA after 60s; continuing"
                        break
                      fi
                      sleep 2
                      WAITED=$((WAITED + 2))
                    done
                  done
                  for DEPLOY in $(kubectl -n {{ . }} get deploy -o name 2>/dev/null); do
                    if [ "$(kubectl -n {{ . }} get "$DEPLOY" -o jsonpath='{.spec.replicas}')" != "0" ]; then
                      kubectl -n {{ . }} scale "$DEPLOY" --replicas=0
                      log "INFO" "Scaled $DEPLOY in {{ . }} back to 0 (raised by an autoscaler during shutdown)"
                    fi
                  done
                  {{- end }}
                  {{- else }}
                  log "INFO" "Applications block disabled; skipping app workload shutdown"
                  {{- end }}

                  {{- if $depEnabled }}
                  # === Dependencies after app CJ/SJ handling ===
                  log "INFO" "Saving replica counts and scaling platform dependencies to zero"
                  {{- range $apps }}
                  for DEPLOY in $(kubectl -n {{ .namespace }} get deploy {{ if .labelSelector }}-l "{{ .labelSelector }}" {{ end }}-o name 2>/dev/null); do
                    NAME=$(echo "$DEPLOY" | cut -d/ -f2)
                    REPLICAS=$(kubectl -n {{ .namespace }} get "$DEPLOY" -o jsonpath='{.spec.replicas}')
                    if [ -n "$REPLICAS" ] && [ "$REPLICAS" != "0" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ .namespace }}_${NAME}\":\"${REPLICAS}\"," 
                      kubectl -n {{ .namespace }} scale "$DEPLOY" --replicas=0
                      log "INFO" "Scaled $DEPLOY in {{ .namespace }} from $REPLICAS to 0"
                    else
                      keep_state "{{ .namespace }}_${NAME}"
                      log "INFO" "Skipping $DEPLOY in {{ .namespace }} (replicas already 0)"
                    fi
                  done
                  for STS in $(kubectl -n {{ .namespace }} get statefulset {{ if .labelSelector }}-l "{{ .labelSelector }}" {{ end }}-o name 2>/dev/null); do
                    NAME=$(echo "$STS" | cut -d/ -f2)
                    REPLICAS=$(kubectl -n {{ .namespace }} get "$STS" -o jsonpath='{.spec.replicas}')
                    if [ -n "$REPLICAS" ] && [ "$REPLICAS" != "0" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ .namespace }}_${NAME}\":\"${REPLICAS}\"," 
                      kubectl -n {{ .namespace }} scale "$STS" --replicas=0
                      log "INFO" "Scaled $STS in {{ .namespace }} from $REPLICAS to 0"
                    else
                      keep_state "{{ .namespace }}_${NAME}"
                      log "INFO" "Skipping $STS in {{ .namespace }} (replicas already 0)"
                    fi
                  done
                  for CJ in $(kubectl -n {{ .namespace }} get cronjob {{ if .labelSelector }}-l "{{ .labelSelector }}" {{ end }}-o name 2>/dev/null); do
                    NAME=$(echo "$CJ" | cut -d/ -f2)
                    SUSPENDED=$(kubectl -n {{ .namespace }} get "$CJ" -o jsonpath='{.spec.suspend}')
                    if [ "$SUSPENDED" != "true" ]; then
                      PATCH_DATA="${PATCH_DATA}\"{{ .namespace }}_cj_${NAME}\":\"false\"," 
                      kubectl -n {{ .namespace }} patch "$CJ" -p '{"spec":{"suspend":true}}'
                      log "INFO" "Suspended $CJ in {{ .namespace }}"
                    else
                      keep_state "{{ .namespace }}_cj_${NAME}"
                      log "INFO" "Skipping $CJ in {{ .namespace }} (already suspended)"
                    fi
                  done
                  {{- end }}
                  {{- else }}
                  log "INFO" "Dependencies block disabled; skipping dependency workload shutdown"
                  {{- end }}

                  # Replace the ConfigMap data with what this run observed: state saved on
                  # earlier runs for objects that no longer exist or are back at their
                  # default (minReplicaCount 0, replicas 0) is dropped; objects found
                  # already shut down carry their saved value forward via keep_state.
                  if [ -n "$PATCH_DATA" ]; then
                    PATCH_DATA="${PATCH_DATA%,}"
                    if ! kubectl -n {{ $ns }} get configmap {{ $stateCmName }} >/dev/null 2>&1; then
                      printf "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ $stateCmName }}\n  namespace: {{ $ns }}\ndata: {}\n" | kubectl apply -f -
                    fi
                    kubectl -n {{ $ns }} patch configmap {{ $stateCmName }} --type=json -p "[{\"op\":\"add\",\"path\":\"/data\",\"value\":{${PATCH_DATA}}}]"
                    log "INFO" "Replaced ConfigMap {{ $stateCmName }} data with the state observed in this run"
                  else
                    log "INFO" "No state captured; keeping existing ConfigMap data as-is"
                  fi

                  {{- if $sweepEnabled }}

                  # === Karpenter sweep: remove nodes held only by add-on pods ===
                  ADDON_NS="{{ join " " $sweepNamespaces }}"
                  log "INFO" "Karpenter sweep: removing nodes whose only non-DaemonSet pods are in: $ADDON_NS"
                  SELF_NODE=$(kubectl -n {{ $ns }} get pod "$HOSTNAME" -o jsonpath='{.spec.nodeName}' 2>/dev/null || true)
                  REMAINING=$(kubectl get nodes -l karpenter.sh/nodepool -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}' 2>/dev/null || true)
                  SWEEP_ELAPSED=0
                  while [ -n "$(echo "$REMAINING" | tr -d ' ')" ]; do
                    NEXT=""
                    for NODE in $REMAINING; do
                      if ! kubectl get node "$NODE" >/dev/null 2>&1; then
                        log "INFO" "Sweep: node $NODE is gone"
                        continue
                      fi
                      NODE_DND=$(kubectl get node "$NODE" -o jsonpath='{.metadata.annotations.karpenter\.sh/do-not-disrupt}' 2>/dev/null || true)
                      if [ "$NODE_DND" = "true" ]; then
                        log "INFO" "Sweep: skipping node $NODE (node has karpenter.sh/do-not-disrupt)"
                        continue
                      fi
                      if ! PODS=$(kubectl get pods -A --field-selector "spec.nodeName=$NODE,status.phase!=Succeeded,status.phase!=Failed" -o jsonpath='{range .items[*]}{.metadata.namespace}{"|"}{.metadata.name}{"|"}{.metadata.ownerReferences[0].kind}{"|"}{.metadata.annotations.karpenter\.sh/do-not-disrupt}{"\n"}{end}' 2>/dev/null); then
                        NEXT="$NEXT $NODE"
                        continue
                      fi
                      BLOCK=""
                      OTHER=""
                      ADDONS=""
                      for LINE in $PODS; do
                        P_NS=${LINE%%|*}
                        REST=${LINE#*|}
                        P_NAME=${REST%%|*}
                        REST=${REST#*|}
                        P_KIND=${REST%%|*}
                        P_DND=${REST#*|}
                        [ "$P_KIND" = "DaemonSet" ] && continue
                        if [ "$P_NS" = "{{ $ns }}" ] && [ "$P_NAME" = "$HOSTNAME" ]; then
                          continue
                        fi
                        if [ "$P_DND" = "true" ]; then
                          BLOCK="$BLOCK $P_NS/$P_NAME"
                          continue
                        fi
                        case " $ADDON_NS " in
                          *" $P_NS "*) ADDONS="$ADDONS $P_NS/$P_NAME" ;;
                          *) OTHER="$OTHER $P_NS/$P_NAME" ;;
                        esac
                      done
                      if [ -n "$BLOCK" ]; then
                        log "INFO" "Sweep: skipping node $NODE (do-not-disrupt pods:$BLOCK)"
                      elif [ -n "$OTHER" ]; then
                        NEXT="$NEXT $NODE"
                      elif [ "$NODE" = "$SELF_NODE" ]; then
                        log "INFO" "Sweep: node $NODE runs this job; cordoning and evicting add-on pods:${ADDONS:- none}"
                        if kubectl drain "$NODE" --ignore-daemonsets --delete-emptydir-data --pod-selector='!batch.kubernetes.io/job-name' --timeout=120s >/dev/null 2>&1; then
                          log "INFO" "Sweep: drained $NODE; Karpenter removes it once this job ends"
                        else
                          kubectl uncordon "$NODE" >/dev/null 2>&1 || true
                          log "WARNING" "Sweep: drain of $NODE failed; node uncordoned and left in place"
                        fi
                      else
                        NODECLAIM=$(kubectl get nodeclaims -o jsonpath="{range .items[?(@.status.nodeName=='$NODE')]}{.metadata.name}{end}" 2>/dev/null || true)
                        if [ -n "$NODECLAIM" ]; then
                          kubectl delete nodeclaim "$NODECLAIM" --wait=false >/dev/null
                          log "INFO" "Sweep: deleted nodeclaim/$NODECLAIM (node $NODE, add-on pods:${ADDONS:- none})"
                        else
                          log "WARNING" "Sweep: no nodeclaim found for node $NODE; left in place"
                        fi
                      fi
                    done
                    REMAINING="$NEXT"
                    [ -z "$(echo "$REMAINING" | tr -d ' ')" ] && break
                    if [ "$SWEEP_ELAPSED" -ge {{ $sweepTimeout }} ]; then
                      log "WARNING" "Sweep: nodes still holding workloads after {{ $sweepTimeout }}s, left to Karpenter:$REMAINING"
                      break
                    fi
                    sleep 15
                    SWEEP_ELAPSED=$((SWEEP_ELAPSED + 15))
                  done
                  log "INFO" "Karpenter sweep complete"
                  {{- end }}

                  log "INFO" "Platform shutdown complete. Karpenter will consolidate empty nodes."

